---
- name: configure | Gather file state
  ansible.builtin.include_tasks: facts.yml

- name: configure | Fix ownership and remove excess permissions
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "{{ item.new_mode }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    follow: false
  loop: "{{ __lh_fs_findings }}"
  loop_control:
    label: "{{ item.path }}"
