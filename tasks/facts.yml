---
# Read-only. Sets __linux_hardening_fs_findings: [{path, expected, actual, new_mode, owner, group}] for deviating items.
- name: facts | Gather the minimal fact subset
  ansible.builtin.setup:
    gather_subset: [min]
  when: ansible_facts['os_family'] is not defined

- name: facts | Stat the managed paths
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
    get_checksum: false
  loop: >-
    {{ (__linux_hardening_fs_base + linux_hardening_fs_extra)
       | rejectattr('path', 'in', linux_hardening_fs_exclude) | list }}
  loop_control:
    label: "{{ item.path }}"
  register: __linux_hardening_fs_stats

# Per octal digit: the digit must be a bit-subset of the maximum; new_mode keeps only the allowed bits.
- name: facts | Compare with desired state
  ansible.builtin.set_fact:
    __linux_hardening_fs_findings_json: >-
      {%- set out = [] -%}
      {%- for r in __linux_hardening_fs_stats.results if r.stat.exists and not r.stat.islnk -%}
      {%- set want = r.item.mode -%}
      {%- set have = r.stat.mode -%}
      {%- set new = namespace(mode='') -%}
      {%- for i in range(4) -%}
      {%- set allowed = __linux_hardening_fs_subsets[want[i] | int]
                        | intersect(__linux_hardening_fs_subsets[have[i] | int]) -%}
      {%- set new.mode = new.mode ~ (allowed | max) -%}
      {%- endfor -%}
      {%- if new.mode != have or r.stat.pw_name != r.item.owner or r.stat.gr_name != r.item.group -%}
      {%- set _ = out.append({'path': r.item.path,
                              'expected': 'mode <= ' ~ want ~ ' ' ~ r.item.owner ~ ':' ~ r.item.group,
                              'actual': have ~ ' ' ~ r.stat.pw_name ~ ':' ~ r.stat.gr_name,
                              'new_mode': new.mode, 'owner': r.item.owner, 'group': r.item.group}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out | to_json }}

- name: facts | Normalise findings
  ansible.builtin.set_fact:
    __linux_hardening_fs_findings: "{{ __linux_hardening_fs_findings_json | from_json }}"
