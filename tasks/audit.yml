---
- name: audit | Gather file state
  ansible.builtin.include_tasks: facts.yml

- name: audit | Record findings
  ansible.builtin.set_fact:
    linux_hardening_fs_findings: "{{ __linux_hardening_fs_findings }}"

- name: audit | Report filesystem_hardening result
  ansible.builtin.debug:
    msg: >-
      {{ 'COMPLIANT' if linux_hardening_fs_findings | length == 0
         else linux_hardening_fs_findings | map(attribute='path') | list }}

- name: audit | Fail on findings
  ansible.builtin.fail:
    msg: "filesystem_hardening found {{ linux_hardening_fs_findings | length }} deviation(s)."
  when:
    - linux_hardening_fs_findings | length > 0
    - (linux_hardening_fail_on_error | bool) or (__linux_hardening_fs_audit_fatal | default(false))
