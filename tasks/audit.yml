---
- name: audit | Check file state
  ansible.builtin.include_tasks: apply.yml
  vars:
    __linux_hardening_fs_check: true

- name: audit | Reset findings
  ansible.builtin.set_fact:
    linux_hardening_fs_findings: []

- name: audit | Record findings
  ansible.builtin.set_fact:
    linux_hardening_fs_findings: >-
      {{ linux_hardening_fs_findings + [{
           'path': __want.path,
           'expected': 'mode <= ' ~ __want.mode ~ ' ' ~ __want.owner ~ ':' ~ __want.group,
           'actual': __have.mode ~ ' ' ~ __have.pw_name ~ ':' ~ __have.gr_name,
           'owner': __want.owner, 'group': __want.group}] }}
  loop: "{{ __linux_hardening_fs_result.results }}"
  loop_control:
    label: "{{ item.item.item.path }}"
  when: item.diff.before != item.diff.after
  vars:
    __want: "{{ item.item.item }}"  # file result -> stat result -> managed item
    __have: "{{ item.item.stat }}"

- name: audit | Report filesystem_hardening result
  ansible.builtin.debug:
    msg: "{{ linux_hardening_fs_findings | map(attribute='path') | list or 'COMPLIANT' }}"

- name: audit | Fail on findings
  ansible.builtin.fail:
    msg: "filesystem_hardening found {{ linux_hardening_fs_findings | length }} deviation(s)."
  when:
    - linux_hardening_fs_findings | length > 0
    - linux_hardening_fail_on_error | bool
