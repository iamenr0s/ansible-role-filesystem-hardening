---
# Our own selection from common hardening guidance. NOT a verified CIS mapping (all entries unmapped).
# mode = most permissive allowed. Missing paths and symlinks are skipped.
__linux_hardening_fs_shadow: >-
  {{ {'Debian': {'mode': '0640', 'group': 'shadow'}}[ansible_facts['os_family']]
     | default({'mode': '0000', 'group': 'root'}) }}
__linux_hardening_fs_base:
  - {path: /etc/passwd, mode: '0644', owner: root, group: root}
  - {path: /etc/passwd-, mode: '0644', owner: root, group: root}
  - {path: /etc/group, mode: '0644', owner: root, group: root}
  - {path: /etc/group-, mode: '0644', owner: root, group: root}
  - path: /etc/shadow
    mode: "{{ __linux_hardening_fs_shadow.mode }}"
    owner: root
    group: "{{ __linux_hardening_fs_shadow.group }}"
  - path: /etc/shadow-
    mode: "{{ __linux_hardening_fs_shadow.mode }}"
    owner: root
    group: "{{ __linux_hardening_fs_shadow.group }}"
  - path: /etc/gshadow
    mode: "{{ __linux_hardening_fs_shadow.mode }}"
    owner: root
    group: "{{ __linux_hardening_fs_shadow.group }}"
  - path: /etc/gshadow-
    mode: "{{ __linux_hardening_fs_shadow.mode }}"
    owner: root
    group: "{{ __linux_hardening_fs_shadow.group }}"
  - {path: /etc/issue, mode: '0644', owner: root, group: root}
  - {path: /etc/issue.net, mode: '0644', owner: root, group: root}
  - {path: /etc/crontab, mode: '0600', owner: root, group: root}
  - {path: /etc/cron.hourly, mode: '0700', owner: root, group: root}
  - {path: /etc/cron.daily, mode: '0700', owner: root, group: root}
  - {path: /etc/cron.weekly, mode: '0700', owner: root, group: root}
  - {path: /etc/cron.monthly, mode: '0700', owner: root, group: root}
  - {path: /etc/cron.d, mode: '0700', owner: root, group: root}
# Bits a maximum octal digit does NOT allow (r=4 w=2 x=1). For the special digit, r/w/x stand for setuid/setgid/sticky.
__linux_hardening_fs_drop: {'0': rwx, '1': rw, '2': rx, '3': r, '4': wx, '5': w, '6': x, '7': ''}
