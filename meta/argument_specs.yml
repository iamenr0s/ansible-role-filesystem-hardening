---
argument_specs:
  main:
    short_description: Audit and fix ownership and permissions of core system files.
    options:
      linux_hardening_mode: {type: str, default: audit, choices: [audit, remediate], description: "audit is read-only."}
      linux_hardening_confirm_remediation:
        type: bool
        default: false
        description: "Must be true before remediate changes anything."
      linux_hardening_verify: {type: bool, default: true, description: "Re-audit after remediation."}
      linux_hardening_fail_on_error:
        type: bool
        default: true
        description: "Fail the play when audit finds deviations."
      linux_hardening_fs_enabled: {type: bool, default: true, description: "Run the role."}
      linux_hardening_fs_extra:
        type: list
        elements: dict
        default: []
        description: "Extra items; mode is the most permissive allowed."
        options:
          path: {type: path, required: true}
          mode: {type: str, required: true, description: "Four octal digits, e.g. '0640'."}
          owner: {type: str, required: true}
          group: {type: str, required: true}
      linux_hardening_fs_exclude: {type: list, elements: path, default: [], description: "Paths to leave alone."}
