---
- name: Prepare (loosen permissions)
  hosts: all
  become: false
  gather_facts: false
  tasks:
    - name: Loosen files; keep one stricter than the maximum
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: "{{ item.mode }}"
        owner: "{{ item.owner | default('root') }}"
      loop:
        - {path: /etc/passwd, mode: '7666'}  # setuid, setgid and sticky must all be removed
        - {path: /etc/group, mode: '0664', owner: bin}
        - {path: /etc/group-, mode: '0600'}
